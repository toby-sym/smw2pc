name: Verify

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, build, and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Smw2Pc.sln
      - run: dotnet format Smw2Pc.sln --verify-no-changes --no-restore
      - run: dotnet build Smw2Pc.sln --configuration Release --no-restore
      - run: dotnet test Smw2Pc.sln --configuration Release --no-build --no-restore
      - name: Check build version rules
        shell: pwsh
        run: ./tools/test-build-version.ps1
